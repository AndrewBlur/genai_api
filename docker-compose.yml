services:
## Database Configs
  database:
    image: mongodb/mongodb-atlas-local
    container_name: genai_database
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"

## Backend Configs
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: genai_backend
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    environment:
      - DB_CONN_STR=mongodb://genai_database:27017/?directConnection=true
      - DB_NAME=genai_db
      - ALGORITHM=HS256
      - SECRET_KEY=Andrew
    depends_on:
      - database


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genai_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://genai_backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
