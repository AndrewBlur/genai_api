name: Docker Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repo code
      uses: actions/checkout@v4

    - name: Build backend Docker image
      run: |
        docker build -t genai-backend:latest -f app/Dockerfile .
        
    - name: Build frontend Docker image
      run: |
        docker build -t genai-frontend:latest -f frontend/Dockerfile ./frontend